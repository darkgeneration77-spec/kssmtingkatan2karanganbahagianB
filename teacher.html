<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教师中心｜Form 2 BM Karangan</title><style>body{font-family:Arial,'Microsoft YaHei',sans-serif;background:#f7f5ef;color:#20252b;margin:0;line-height:1.7}.w{max-width:1000px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#fff;border:1px solid #ddd8cc;border-radius:18px;padding:20px;text-decoration:none;color:inherit}.card b{font-size:1.2rem;color:#315f72}.btn{display:inline-block;padding:9px 13px;border:1px solid #ddd;border-radius:10px;background:#fff;text-decoration:none;color:inherit}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="w"><a class="btn" href="index.html">← 回主页</a><h1>教师中心</h1><p>教学顺序：诊断 → 文体引擎 → Tema → 转换 → 模拟 → 针对性补救。不要因为资料很多就每天随机抽一页，这会把课程重新变成资料仓库。</p><div class="grid"><a class="card" href="answer-guide.html"><b>教学指南</b><p>整套系统使用原则与观察维度。</p></a><a class="card" href="format-lab.html"><b>格式复习</b><p>课堂投影或打印使用。</p></a><a class="card" href="practice-lab.html"><b>三级训练</b><p>从识别到完整输出。</p></a><a class="card" href="model-answers.html"><b>模拟答案与评分</b><p>Planning、参考内容、范文与批改重点。</p></a><a class="card" href="phase3.html"><b>迁移训练</b><p>同一 Tema 换文体，减少死背。</p></a><a class="card" href="checklist.html"><b>交卷检查</b><p>可作为学生自评与教师反馈清单。</p></a></div></main></body></html>
