<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSKP A标准 Checklist</title><style>body{font-family:Arial,'Microsoft YaHei',sans-serif;background:#f7f5ef;color:#20252b;margin:0;line-height:1.65}.w{max-width:900px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #ddd8cc;border-radius:18px;padding:20px;margin:14px 0}.item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #eee}.item input{width:22px;height:22px}.score{font-size:2rem;font-weight:900;color:#315f72}.btn{display:inline-block;padding:9px 13px;border:1px solid #ccc;border-radius:10px;background:#fff;text-decoration:none;color:inherit}.result{background:#eef3f4;padding:16px;border-radius:12px}</style></head><body><main class="w"><a class="btn" href="dskp-standard.html">← DSKP标准</a><h1>DSKP A标准｜交稿前 10 项</h1><p>这里的“A标准”是本系统的优秀写作目标，不冒充 DSKP 官方 grade。每项对应 3.2、3.4 或 3.7 的实际能力。</p><section class="card" id="list"></section><section class="card result"><span class="score" id="s">0/10</span><p id="msg">先检查作文。</p></section><script>let items=['我准确回答了 Kata Tugas / Kehendak。','写作前有清楚的 kerangka / Planning。','每个主要 Isi 都有 Ayat Topik。','Isi 有清楚的 Huraian，不只是列点。','使用具体而相关的 Contoh。','段落有 Penegasan，或自然收束该 Isi。','Pendahuluan 进入 Tema，并锁定题目方向。','Kesimpulan 总结全文，没有突然增加新 Isi。','句子整体 gramatis，ejaan 与 tanda baca 已检查。','全文语言准确、自然、有变化，而且质量保持 tekal。'];list.innerHTML=items.map((x,i)=>`<label class="item"><input type="checkbox" onchange="go()"><span><b>${i+1}.</b> ${x}</span></label>`).join('');function go(){let n=[...document.querySelectorAll('input')].filter(x=>x.checked).length;s.textContent=n+'/10';msg.textContent=n<=4?'基础尚未稳定：回到审题、Planning 和句段训练。':n<=7?'已经基本成立：重点补发展、语法和全文稳定性。':n<=9?'接近高质量：继续检查细节、语言准确度与一致性。':'达到本系统 A标准目标：再由教师以整体表现判断是否达到 TP5/TP6 水平。'}go()</script></main></body></html>
