<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作文订正系统｜Before / After</title><style>body{font-family:Arial,'Microsoft YaHei',sans-serif;background:#f7f5ef;color:#20252b;margin:0;line-height:1.65}.w{max-width:1100px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #ddd8cc;border-radius:18px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.essay{white-space:pre-wrap;background:#fafafa;border-radius:12px;padding:15px;min-height:240px}.btn{display:inline-block;padding:9px 13px;border:1px solid #ccc;border-radius:10px;background:#fff;text-decoration:none;color:inherit;cursor:pointer}.primary{background:#315f72;color:#fff}.meta{background:#eef3f4;padding:12px;border-radius:10px}textarea{width:100%;box-sizing:border-box;min-height:320px;padding:14px;border:1px solid #bbb;border-radius:10px;font-size:1rem;line-height:1.7}.scoregrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.scorebox{background:#f4f4f2;padding:12px;border-radius:10px;text-align:center}.up{background:#edf7ef;padding:12px;border-left:5px solid #548565}.same{background:#fff8e8;padding:12px;border-left:5px solid #b58a43}@media(max-width:760px){.grid,.scoregrid{grid-template-columns:1fr}}</style></head><body><main class="w"><a class="btn" href="teacher.html">← 教师中心</a><h1>作文订正系统｜Before / After</h1><p>用途：不是把错误抄一遍，而是把第一次作文、订正版和第二次评分放在一起，看补救到底有没有效果。</p><section class="card"><label>选择一份已评分作文：<select id="pick" onchange="loadRecord()" style="width:100%;padding:10px;border-radius:9px"></select></label></section><section class="card" id="work" style="display:none"><div class="meta" id="meta"></div><div class="grid"><div><h2>Before｜第一次作文</h2><div class="essay" id="before"></div><h3>第一次评分</h3><div class="scoregrid" id="beforeScores"></div></div><div><h2>After｜学生订正版</h2><textarea id="after" placeholder="学生在这里重新写完整订正版。"></textarea><p>订正版字数：<b id="words">0</b></p></div></div><h2>第二次评分</h2><div class="scoregrid"><label class="scorebox">Kehendak<br><input id="k2" type="range" min="0" max="5" value="3" oninput="compare()"><b id="k2v">3/5</b></label><label class="scorebox">Isi & Huraian<br><input id="i2" type="range" min="0" max="5" value="3" oninput="compare()"><b id="i2v">3/5</b></label><label class="scorebox">Bahasa<br><input id="b2" type="range" min="0" max="5" value="3" oninput="compare()"><b id="b2v">3/5</b></label><label class="scorebox">Organisasi / Format<br><input id="o2" type="range" min="0" max="5" value="3" oninput="compare()"><b id="o2v">3/5</b></label></div><label>教师订正备注<textarea id="note2" style="min-height:120px" placeholder="例如：Kehendak 已修正，但 Bahasa 仍有时态和介词错误。"></textarea></label><div id="compareBox" style="margin-top:14px"></div><p><button class="btn primary" onclick="saveCorrection()">保存订正记录</button> <a class="btn" href="student-progress.html">查看学生进度</a></p></section></main><script>let A=JSON.parse(localStorage.getItem('bmScores')||'[]'),current=null;const pick=document.getElementById('pick'),after=document.getElementById('after');function init(){pick.innerHTML='<option value="">请选择...</option>'+A.filter(r=>r.essay).slice().reverse().map(r=>`<option value="${r.id}">${r.date} · ${r.name||'-'} · ${r.set||''} · ${r.genre||''} · ${r.total||0}/20</option>`).join('')}function loadRecord(){current=A.find(r=>String(r.id)===pick.value);if(!current){work.style.display='none';return}work.style.display='block';meta.innerHTML=`<b>${current.name||'-'}</b> · ${current.set||''} · ${current.question||''} · ${current.theme||''} · ${current.genre||''}<br>弱项：${(current.weak||[]).join('、')||'无明显低项'}`;before.textContent=current.essay||'';beforeScores.innerHTML=`<div class="scorebox">K<br><b>${current.k}/5</b></div><div class="scorebox">I<br><b>${current.i}/5</b></div><div class="scorebox">B<br><b>${current.b}/5</b></div><div class="scorebox">O<br><b>${current.o}/5</b></div>`;k2.value=current.k;i2.value=current.i;b2.value=current.b;o2.value=current.o;compare()}after.oninput=()=>{let t=after.value.trim();words.textContent=t?t.split(/\s+/).length:0};function compare(){if(!current)return;k2v.textContent=k2.value+'/5';i2v.textContent=i2.value+'/5';b2v.textContent=b2.value+'/5';o2v.textContent=o2.value+'/5';let diffs=[['Kehendak',+k2.value-current.k],['Isi & Huraian',+i2.value-current.i],['Bahasa',+b2.value-current.b],['Organisasi / Format',+o2.value-current.o]];let total2=+k2.value + +i2.value + +b2.value + +o2.value,delta=total2-current.total;compareBox.innerHTML=`<div class="${delta>0?'up':'same'}"><b>Before ${current.total}/20 → After ${total2}/20 ${delta>0?'（+'+delta+'）':delta<0?'（'+delta+'）':'（不变）'}</b><br>${diffs.map(x=>x[0]+': '+(x[1]>0?'+'+x[1]:x[1])).join('　')}</div>`}function saveCorrection(){if(!current)return;if(!after.value.trim()){alert('订正版还是空的。');return}let C=JSON.parse(localStorage.getItem('bmCorrections')||'[]'),total2=+k2.value + +i2.value + +b2.value + +o2.value;C.push({id:Date.now(),sourceId:current.id,date:new Date().toLocaleString(),name:current.name,set:current.set,question:current.question,theme:current.theme,genre:current.genre,before:current.essay,after:after.value,words:+words.textContent,beforeScores:{k:current.k,i:current.i,b:current.b,o:current.o,total:current.total},afterScores:{k:+k2.value,i:+i2.value,b:+b2.value,o:+o2.value,total:total2},gain:total2-current.total,note:note2.value.trim()});localStorage.setItem('bmCorrections',JSON.stringify(C));alert('订正记录已保存。')}init()</script></body></html>
