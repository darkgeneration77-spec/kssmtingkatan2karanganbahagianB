<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学生作文进度记录</title><style>body{font-family:Arial,'Microsoft YaHei',sans-serif;background:#f7f5ef;color:#20252b;margin:0;line-height:1.55}.w{max-width:1120px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #ddd8cc;border-radius:18px;padding:20px;margin:14px 0}.btn,select{padding:9px 13px;border:1px solid #ccc;border-radius:10px;background:#fff;text-decoration:none;color:inherit}table{width:100%;border-collapse:collapse;font-size:.94rem}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}.empty{color:#667085;padding:20px;text-align:center}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#eef3f4;padding:14px;border-radius:12px}.bar{height:9px;background:#e5e7eb;border-radius:8px;overflow:hidden}.fill{height:100%;background:#667085}.warn{background:#fff1ef;border-left:5px solid #b85c4d;padding:12px;border-radius:9px;margin:8px 0}.good{background:#edf7ef;border-left:5px solid #548565;padding:12px;border-radius:9px;margin:8px 0}.filters{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.scroll{overflow:auto}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><main class="w"><a class="btn" href="teacher.html">← 教师中心</a> <a class="btn" href="scoring-diagnostic.html">新增评分</a><h1>学生作文进度记录</h1><p>现在可以看 <b>学生 + Tema + Jenis + Set + 弱项</b>，不再只看一个平均分。资料仍保存在本机浏览器。</p><section class="card"><div class="filters"><select id="student" onchange="render()"><option value="ALL">全部学生</option></select><select id="genre" onchange="render()"><option value="ALL">全部 Jenis</option></select><select id="theme" onchange="render()"><option value="ALL">全部 Tema</option></select></div></section><section class="card"><div id="summary"></div></section><section class="card"><h2>弱项模式</h2><div id="patterns"></div></section><section class="card"><h2>按 Jenis 表现</h2><div id="genres"></div></section><section class="card"><h2>历史记录</h2><div class="scroll" id="records"></div><p><button class="btn" onclick="clearAll()">清除本机记录</button></p></section></main><script>let A=JSON.parse(localStorage.getItem('bmScores')||'[]');function uniq(k){return [...new Set(A.map(x=>x[k]).filter(Boolean))].sort()}function init(){uniq('name').forEach(x=>student.insertAdjacentHTML('beforeend',`<option>${x}</option>`));uniq('genre').forEach(x=>genre.insertAdjacentHTML('beforeend',`<option>${x}</option>`));uniq('theme').forEach(x=>theme.insertAdjacentHTML('beforeend',`<option>${x}</option>`));render()}function data(){return A.filter(r=>(student.value==='ALL'||r.name===student.value)&&(genre.value==='ALL'||r.genre===genre.value)&&(theme.value==='ALL'||r.theme===theme.value))}function av(B,k){return B.length?(B.reduce((s,r)=>s+(+r[k]||0),0)/B.length).toFixed(1):'0.0'}function card(label,val){return `<div class="stat"><b>${label}</b><br>${val}/5<div class="bar"><div class="fill" style="width:${val*20}%"></div></div></div>`}function render(){let B=data();if(!B.length){summary.innerHTML='<div class="empty">没有符合筛选条件的记录。</div>';patterns.innerHTML='';genres.innerHTML='';records.innerHTML='';return}summary.innerHTML=`<p><b>记录次数：</b>${B.length}</p><div class="grid">${card('Kehendak',av(B,'k'))}${card('Isi & Huraian',av(B,'i'))}${card('Bahasa',av(B,'b'))}${card('Organisasi / Format',av(B,'o'))}</div>`;let c={Kehendak:0,'Isi & Huraian':0,Bahasa:0,'Organisasi / Format':0};B.forEach(r=>(r.weak||[]).forEach(x=>{if(c[x]!==undefined)c[x]++}));let sorted=Object.entries(c).sort((a,b)=>b[1]-a[1]);patterns.innerHTML=sorted.map(([k,n])=>n?`<div class="warn"><b>${k}</b>：${n}/${B.length} 次记录处于弱项区（0–2）。</div>`:`<div class="good"><b>${k}</b>：筛选记录中没有落入弱项区。</div>`).join('');let G={};B.forEach(r=>{let g=r.genre||'未记录';(G[g]||(G[g]=[])).push(r)});genres.innerHTML='<table><tr><th>Jenis</th><th>次数</th><th>K</th><th>I</th><th>B</th><th>O</th><th>观察</th></tr>'+Object.entries(G).map(([g,x])=>{let vals=[av(x,'k'),av(x,'i'),av(x,'b'),av(x,'o')].map(Number),m=Math.min(...vals),lab=['Kehendak','Isi','Bahasa','Format'][vals.indexOf(m)];return `<tr><td>${g}</td><td>${x.length}</td><td>${vals[0]}</td><td>${vals[1]}</td><td>${vals[2]}</td><td>${vals[3]}</td><td>当前最低：${lab}</td></tr>`}).join('')+'</table>';records.innerHTML='<table><tr><th>日期</th><th>学生</th><th>Set</th><th>Tema</th><th>Jenis</th><th>K</th><th>I</th><th>B</th><th>O</th><th>弱项</th><th>备注</th></tr>'+B.slice().reverse().map(r=>`<tr><td>${r.date}</td><td>${r.name||'-'}</td><td>${r.set||'-'}</td><td>${r.theme||'-'}</td><td>${r.genre||'-'}</td><td>${r.k}</td><td>${r.i}</td><td>${r.b}</td><td>${r.o}</td><td>${(r.weak||[]).join(', ')||'-'}</td><td>${r.note||''}</td></tr>`).join('')+'</table>'}function clearAll(){if(confirm('确定清除这台设备的全部作文评分记录？')){localStorage.removeItem('bmScores');A=[];student.innerHTML='<option value="ALL">全部学生</option>';genre.innerHTML='<option value="ALL">全部 Jenis</option>';theme.innerHTML='<option value="ALL">全部 Tema</option>';render()}}init()</script></body></html>
