<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学生作文进度记录</title><style>body{font-family:Arial,'Microsoft YaHei',sans-serif;background:#f7f5ef;color:#20252b;margin:0}.w{max-width:1050px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #ddd8cc;border-radius:18px;padding:20px;margin:14px 0}.btn{padding:9px 13px;border:1px solid #ccc;border-radius:10px;background:#fff;cursor:pointer;text-decoration:none;color:inherit;display:inline-block}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}.empty{color:#667085;padding:20px;text-align:center}.bar{height:10px;background:#e5e7eb;border-radius:8px;overflow:hidden}.fill{height:100%;background:#667085}</style></head><body><main class="w"><a class="btn" href="teacher.html">← 教师中心</a><h1>学生作文进度记录</h1><p>读取这台设备由“作文评分诊断器”保存的记录。没有服务器，没有假装云端会魔法同步。换设备后资料不会自动出现。</p><section class="card"><div id="summary"></div></section><section class="card"><h2>历史记录</h2><div id="records"></div><p><button class="btn" onclick="clearAll()">清除本机记录</button></p></section></main><script>let A=JSON.parse(localStorage.getItem('bmScores')||'[]');function render(){if(!A.length){summary.innerHTML='<div class="empty">还没有评分记录。</div>';records.innerHTML='';return}let av=x=>(A.reduce((s,r)=>s+(+r[x]),0)/A.length).toFixed(1);summary.innerHTML=`<b>记录次数：</b>${A.length}<br><br>Kehendak ${av('k')}/5<div class="bar"><div class="fill" style="width:${av('k')*20}%"></div></div><br>Isi & Huraian ${av('i')}/5<div class="bar"><div class="fill" style="width:${av('i')*20}%"></div></div><br>Bahasa ${av('b')}/5<div class="bar"><div class="fill" style="width:${av('b')*20}%"></div></div><br>Organisasi/Format ${av('o')}/5<div class="bar"><div class="fill" style="width:${av('o')*20}%"></div></div>`;records.innerHTML='<table><tr><th>日期</th><th>学生</th><th>K</th><th>I</th><th>B</th><th>O</th><th>备注</th></tr>'+A.slice().reverse().map(r=>`<tr><td>${r.date}</td><td>${r.name||'-'}</td><td>${r.k}</td><td>${r.i}</td><td>${r.b}</td><td>${r.o}</td><td>${r.note||''}</td></tr>`).join('')+'</table>'}function clearAll(){if(confirm('确定清除这台设备的全部作文评分记录？')){localStorage.removeItem('bmScores');A=[];render()}}render()</script></body></html>
