<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kata Tugas 题型转换实验室</title><style>body{font-family:Arial,'Microsoft YaHei',sans-serif;background:#f7f5ef;color:#20252b;margin:0;line-height:1.72}.w{max-width:1080px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #ddd8cc;border-radius:18px;padding:20px;margin:14px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button,.btn{padding:9px 12px;border:1px solid #ccc;border-radius:10px;background:#fff;cursor:pointer;text-decoration:none;color:inherit;font-weight:bold}.tabs button.active{background:#315f72;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.type{background:#eef3f4;border-radius:14px;padding:15px}.type h3{margin-top:0;color:#315f72}.wrong{background:#fff1ef;border-left:5px solid #b85c4d;padding:12px}.right{background:#edf7ef;border-left:5px solid #548565;padding:12px}.bm{font-size:1.03rem}.hide{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="w"><a class="btn" href="student.html">← 学生中心</a><h1>Kata Tugas｜题型转换实验室</h1><p>同一个 Tema，题目只换一个词，答案方向就可能完全不同。人类考试最喜欢这种小机关，所以这里专门拆掉它。</p><div class="tabs" id="tabs"></div><div id="content"></div></main><script>const D=[
['Diri & Remaja','mengurus masa','Cara menjadi remaja yang berdisiplin','Faedah mengurus masa dengan bijak','Kepentingan disiplin diri kepada remaja','Pengalaman anda mencapai suatu matlamat'],
['Keluarga','meluangkan masa bersama keluarga','Cara mengeratkan hubungan kekeluargaan','Faedah melakukan aktiviti bersama keluarga','Kepentingan institusi keluarga','Pengalaman menyertai aktiviti bersama keluarga'],
['Sekolah & Pendidikan','memberikan tumpuan semasa belajar','Cara mencapai kecemerlangan dalam pelajaran','Faedah membaca kepada murid','Kepentingan pendidikan kepada remaja','Pengalaman menyertai program akademik di sekolah'],
['Kesihatan','bersenam secara berkala','Cara menjaga kesihatan diri','Faedah bersukan kepada remaja','Kepentingan gaya hidup sihat','Pengalaman menyertai program kesihatan'],
['Alam Sekitar','mengamalkan kitar semula','Langkah memelihara alam sekitar','Faedah amalan kitar semula','Kepentingan menjaga alam sekitar','Pengalaman menyertai gotong-royong'],
['Teknologi & Internet','menggunakan teknologi secara berhemah','Cara menggunakan Internet dengan selamat','Faedah teknologi dalam pembelajaran','Kepentingan penggunaan teknologi secara berhemah','Pengalaman menggunakan teknologi untuk pembelajaran'],
['Sukan & Rekreasi','bersukan secara berkala','Cara menggalakkan remaja bersukan','Faedah bersukan','Kepentingan aktiviti rekreasi','Pengalaman menyertai kejohanan sukan'],
['Keselamatan','mematuhi peraturan keselamatan','Langkah menjaga keselamatan diri','Faedah mematuhi peraturan keselamatan','Kepentingan keselamatan di sekolah','Pengalaman menghadapi suatu kecemasan'],
['Masyarakat & Kejiranan','menyertai aktiviti kemasyarakatan','Cara mengeratkan hubungan kejiranan','Faedah aktiviti gotong-royong','Kepentingan semangat kejiranan','Pengalaman menyertai aktiviti kejiranan'],
['Perpaduan','menghormati kepelbagaian budaya','Cara memupuk perpaduan','Faedah hidup bersatu padu','Kepentingan perpaduan kepada negara','Pengalaman menyertai aktiviti perpaduan'],
['Patriotisme','mengenali sejarah negara','Cara memupuk semangat patriotik','Faedah menyertai sambutan kebangsaan','Kepentingan semangat cinta akan negara','Pengalaman menyertai sambutan Hari Kebangsaan'],
['Nilai Murni','mengamalkan sikap tolong-menolong','Cara memupuk nilai murni','Faedah mengamalkan sikap tolong-menolong','Kepentingan nilai murni dalam kehidupan','Pengalaman membantu seseorang']];
let tabs=document.getElementById('tabs');D.forEach((d,i)=>{let b=document.createElement('button');b.textContent='T'+(i+1)+' '+d[0];b.onclick=()=>show(i);tabs.appendChild(b)});function show(i){[...tabs.children].forEach((b,j)=>b.classList.toggle('active',i===j));let d=D[i];document.getElementById('content').innerHTML=`<section class="card"><h2>T${i+1}｜${d[0]}</h2><p><b>核心内容：</b>${d[1]}</p><div class="grid"><div class="type"><h3>Cara / Langkah</h3><p class="bm">${d[2]}</p><p><b>答案必须：</b>写行动 / 方法。Ayat Topik 可用 <i>Antara langkah yang boleh dilakukan ialah...</i></p></div><div class="type"><h3>Faedah / Kebaikan</h3><p class="bm">${d[3]}</p><p><b>答案必须：</b>写得到的好处。Ayat Topik 可用 <i>Salah satu faedah ... ialah...</i></p></div><div class="type"><h3>Kepentingan</h3><p class="bm">${d[4]}</p><p><b>答案必须：</b>解释为什么重要及其作用，不能只是列行动。</p></div><div class="type"><h3>Pengalaman</h3><p class="bm">${d[5]}</p><p><b>答案必须：</b>变成事件。Siapa + Bila + Di mana + Apa berlaku + Perasaan/Pengajaran。</p></div></div><h3>最容易离题的地方</h3><p class="wrong">题目问 <b>faedah</b>，却写“kita hendaklah...”三个做法。这些句子可能语言完全正确，但 Kehendak 已经跑掉。</p><p class="right">先把题目改写成一句华语：它要我写“怎样做 / 有什么好处 / 为什么重要 / 发生什么经历”？确认以后才列 Isi。</p></section>`}show(0)</script></body></html>
