<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kata Tugas 专业转换实验室</title><style>body{font-family:Arial,'Microsoft YaHei',sans-serif;background:#f7f5ef;color:#20252b;margin:0;line-height:1.72}.w{max-width:1080px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #ddd8cc;border-radius:18px;padding:20px;margin:14px 0}.nav,.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button,.btn{padding:9px 12px;border:1px solid #ccc;border-radius:10px;background:#fff;cursor:pointer;text-decoration:none;color:inherit;font-weight:bold}.tabs button.active{background:#315f72;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.type{background:#eef3f4;border-radius:14px;padding:15px}.type h3{margin-top:0;color:#315f72}.wrong{background:#fff1ef;border-left:5px solid #b85c4d;padding:12px}.right{background:#edf7ef;border-left:5px solid #548565;padding:12px}.audit{background:#fff8e8;border-left:5px solid #b58a43;padding:13px}.bm{font-size:1.03rem}@media(max-width:700px){.grid{grid-template-columns:1fr}.w{padding:16px}}@media print{.nav,.tabs{display:none}.card{break-inside:avoid}body{background:#fff}}</style></head><body><main class="w"><div class="nav"><a class="btn" href="index.html">主页</a><a class="btn" href="student.html">← 学生中心</a><a class="btn" href="theme-highscore.html">12 Tema 句段银行</a><button class="btn" onclick="window.print()">打印 / PDF</button></div><h1>Kata Tugas｜专业题型转换实验室</h1><p>同一个 Tema 只是“内容范围”，真正决定作文方向的是 <b>Kata Tugas + Kehendak Soalan</b>。这里训练学生先判断，再写，不靠猜 Q1/Q2/Q3。</p><div class="audit"><b>专业规则：</b>Cara/Langkah = 行动；Faedah/Kebaikan = 获得的好处；Kepentingan = 为什么重要/发挥什么作用；Punca = 原因；Kesan = 后果/影响；Peranan = 指定对象应采取的行动；Pengalaman/Ceritakan = 事件发展。题目措辞若更具体，必须服从具体要求。</div><div class="tabs" id="tabs"></div><div id="content"></div></main><script>const D=[['Diri & Remaja','pengurusan masa / disiplin diri','Cara menjadi remaja yang berdisiplin','Faedah mengurus masa dengan bijak','Kepentingan disiplin diri kepada remaja','Pengalaman anda berusaha mencapai suatu matlamat'],['Keluarga','hubungan / komunikasi / tanggungjawab','Cara mengeratkan hubungan kekeluargaan','Faedah melakukan aktiviti bersama keluarga','Kepentingan keluarga dalam kehidupan remaja','Pengalaman menyertai aktiviti bersama keluarga'],['Sekolah & Pendidikan','ilmu / pembelajaran / disiplin','Cara mencapai kecemerlangan dalam pelajaran','Faedah membaca kepada murid','Kepentingan pendidikan kepada remaja','Pengalaman menyertai program akademik di sekolah'],['Kesihatan','pemakanan / aktiviti fizikal / rehat','Cara menjaga kesihatan diri','Faedah mengamalkan gaya hidup sihat','Kepentingan menjaga kesihatan','Pengalaman menyertai program kesihatan'],['Alam Sekitar','3R / kebersihan / pemeliharaan','Langkah menjaga alam sekitar','Faedah amalan kitar semula','Kepentingan menjaga alam sekitar','Pengalaman menyertai kempen kitar semula'],['Teknologi & Internet','pembelajaran / keselamatan / berhemah','Cara menggunakan Internet secara bijak','Kebaikan Internet kepada pelajar','Kepentingan penggunaan teknologi secara berhemah','Pengalaman menggunakan teknologi untuk menyiapkan tugasan sekolah'],['Sukan & Rekreasi','kecergasan / disiplin / kerjasama','Cara menggalakkan remaja bersukan','Faedah bersukan kepada remaja','Kepentingan aktiviti sukan dan rekreasi','Pengalaman menyertai Hari Sukan sekolah'],['Keselamatan','peraturan / pencegahan / tindakan selamat','Langkah menjaga keselamatan diri','Faedah mematuhi peraturan keselamatan','Kepentingan menjaga keselamatan di sekolah','Pengalaman menghadapi suatu kecemasan'],['Masyarakat & Kejiranan','kerjasama / bantuan / hubungan','Cara mengeratkan hubungan kejiranan','Faedah aktiviti gotong-royong','Kepentingan semangat kejiranan','Pengalaman menyertai aktiviti kejiranan'],['Perpaduan','hormat / kerjasama / persefahaman','Cara memupuk perpaduan dalam kalangan murid','Faedah hidup bersatu padu','Kepentingan perpaduan dalam masyarakat','Pengalaman menyertai aktiviti perpaduan di sekolah'],['Patriotisme','sejarah / cinta negara / tanggungjawab','Cara memupuk semangat patriotik','Faedah menyertai aktiviti sambutan kebangsaan','Kepentingan semangat cinta akan negara','Pengalaman menyertai sambutan Hari Kebangsaan'],['Nilai Murni','jujur / bertanggungjawab / tolong-menolong','Cara memupuk nilai murni','Faedah mengamalkan sikap tolong-menolong','Kepentingan nilai murni dalam kehidupan','Pengalaman membantu seseorang']];const tabs=document.getElementById('tabs'),content=document.getElementById('content');D.forEach((d,i)=>{const b=document.createElement('button');b.textContent='T'+(i+1)+' '+d[0];b.onclick=()=>show(i);tabs.appendChild(b)});function show(i){[...tabs.children].forEach((b,j)=>b.classList.toggle('active',i===j));const d=D[i];content.innerHTML=`<section class="card"><h2>T${i+1}｜${d[0]}</h2><p><b>内容范围：</b>${d[1]}</p><div class="grid"><div class="type"><h3>Cara / Langkah</h3><p class="bm">${d[2]}</p><p><b>判断：</b>“要怎样做？”</p><p><b>主题句：</b><i>Antara langkah yang boleh dilakukan ialah...</i></p></div><div class="type"><h3>Faedah / Kebaikan</h3><p class="bm">${d[3]}</p><p><b>判断：</b>“做了以后得到什么好处？”</p><p><b>主题句：</b><i>Salah satu faedah ... ialah...</i></p></div><div class="type"><h3>Kepentingan</h3><p class="bm">${d[4]}</p><p><b>判断：</b>“为什么重要？有什么作用？”</p><p>可以与 faedah 有内容交集，但论述必须围绕重要性，不能整篇变成做法清单。</p></div><div class="type"><h3>Pengalaman / Ceritakan</h3><p class="bm">${d[5]}</p><p><b>判断：</b>“发生了什么？”</p><p>Latar → Perkembangan → Detik penting / perubahan / Cabaran（如自然需要）→ Tindakan / hasil / Penyelesaian → Perasaan / Pengajaran。</p></div><div class="type"><h3>Punca</h3><p><b>判断：</b>“为什么会发生？”</p><p><i>Antara punca ... ialah...</i> 后面必须解释原因如何导致问题。</p></div><div class="type"><h3>Kesan</h3><p><b>判断：</b>“造成什么影响？”</p><p><i>Salah satu kesan ... ialah...</i> 后面发展结果，不要倒回写原因。</p></div><div class="type"><h3>Peranan</h3><p><b>判断：</b>“题目指定的谁，应做什么？”</p><p>Ayat Topik = pihak/individu + tindakan，例如 <i>Pihak sekolah berperanan menganjurkan...</i></p></div><div class="type"><h3>Pendapat / Bincangkan</h3><p><b>判断：</b>先看题目后半部真正要求。</p><p>“Pada pendapat anda”本身不是固定 Isi 类型；若后面问 <i>bagaimanakah</i>，仍然是 Cara。</p></div></div><h3>离题警报</h3><p class="wrong">问 <b>faedah</b> 却连续写 “kita hendaklah...”；问 <b>langkah</b> 却只写 “alam sekitar menjadi bersih”；问 <b>pengalaman</b> 却整篇解释一般知识。句子可能没错，答案方向已经错。</p><p class="right"><b>四步：</b>圈 Kata Tugas → 用华语说出题目真正要什么 → 每个 Isi 检查是否直接回答 → 才开始扩写 Huraian/Contoh；需要时加入 Kesan，再自然收束 Penegasan。</p></section>`}show(0)</script></body></html>
