<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>18题完整范文库｜Form 2 BM</title><style>body{font-family:Arial,'Microsoft YaHei',sans-serif;background:#f7f5ef;color:#20252b;margin:0;line-height:1.75}.w{max-width:1050px;margin:auto;padding:24px}.box{background:#fff;border:1px solid #ddd8cc;border-radius:18px;padding:20px;margin:14px 0}.q{background:#eef3f4;padding:13px;border-radius:11px}.essay{display:none;background:#fffaf0;border-left:5px solid #b58a43;padding:16px;border-radius:10px}.btn{padding:9px 13px;border:1px solid #ccc;border-radius:10px;background:#fff;cursor:pointer;text-decoration:none;color:inherit;display:inline-block}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button.on{background:#315f72;color:#fff}.note{color:#667085}@media print{.nav,.tabs,.show{display:none}.essay{display:block}.box{break-inside:avoid}}</style></head><body><main class="w"><div class="nav"><a class="btn" href="simulation-solutions.html">← Set 1–6 答案系统</a> <button class="btn" onclick="print()">打印 / PDF</button></div><h1>6 Sets × 3 Questions｜18题完整范文库</h1><p class="note">全部 18 题都有完整参考答案。重点是分析结构与 Kehendak，不是让学生把范文变成脑内复印机。</p><div class="tabs" id="tabs"></div><div id="out"></div></main><script>
const sets=[
['Set 1｜Kebersihan Sekolah',[
['Q1 Pengalaman Gotong-royong',`Pada hari Sabtu yang lalu, sekolah saya telah mengadakan Program Gotong-royong Perdana. Saya dan rakan-rakan berkumpul di dataran sekolah pada awal pagi. Selepas mendengar taklimat guru, kami dibahagikan kepada beberapa kumpulan.<br><br>Kumpulan saya ditugaskan membersihkan taman dan longkang berhampiran kantin. Saya menyapu daun-daun kering manakala rakan-rakan mengutip sampah dan mencabut rumput. Kami bekerjasama dengan bersungguh-sungguh walaupun cuaca semakin panas.<br><br>Ketika membersihkan longkang, seorang rakan hampir tergelincir. Saya segera membantunya dan kami menjadi lebih berhati-hati selepas kejadian itu. Dengan bantuan guru, tugas kami akhirnya dapat diselesaikan.<br><br>Menjelang tengah hari, kawasan sekolah kelihatan bersih dan ceria. Walaupun penat, saya berasa puas hati. Pengalaman ini mengajar saya bahawa kerjasama dan tanggungjawab amat penting dalam menjaga kebersihan sekolah.`],
['Q2 Langkah Menjaga Kebersihan Sekolah',`Kebersihan sekolah penting untuk mewujudkan suasana pembelajaran yang selesa. Oleh itu, semua warga sekolah perlu memainkan peranan dalam menjaga kebersihan persekitaran.<br><br>Antara langkah yang boleh dilakukan ialah murid membuang sampah ke dalam tong sampah yang disediakan. Tindakan ini dapat mengelakkan sampah daripada bertaburan. Sebagai contoh, pembungkus makanan hendaklah dibuang selepas waktu rehat. Kesannya, kawasan sekolah sentiasa bersih.<br><br>Selain itu, jadual bertugas kelas perlu dilaksanakan dengan penuh tanggungjawab. Murid boleh menyapu lantai, mengelap tingkap dan menyusun meja mengikut giliran. Amalan ini memastikan bilik darjah sentiasa kemas dan selesa.<br><br>Pihak sekolah juga boleh menganjurkan aktiviti gotong-royong secara berkala. Aktiviti ini membolehkan murid dan guru membersihkan kawasan sekolah secara bersama-sama. Kesannya, kebersihan dapat dijaga dan semangat kerjasama turut dipupuk.<br><br>Kesimpulannya, kebersihan sekolah merupakan tanggungjawab bersama. Jika semua pihak bekerjasama, persekitaran sekolah yang bersih dan kondusif dapat diwujudkan.`],
['Q3 Laporan Program Gotong-royong',`<b>LAPORAN PROGRAM GOTONG-ROYONG PERDANA</b><br><br>Pada 15 Ogos 2026, sekolah saya telah mengadakan Program Gotong-royong Perdana. Program tersebut bermula pada pukul 7.30 pagi dan melibatkan murid serta guru. Tujuannya adalah untuk membersihkan dan menceriakan kawasan sekolah.<br><br>Sebelum aktiviti bermula, guru memberikan taklimat keselamatan dan membahagikan peserta kepada beberapa kumpulan. Setiap kumpulan diberikan kawasan tertentu seperti bilik darjah, taman, kantin dan longkang.<br><br>Para peserta menjalankan tugas dengan penuh semangat. Mereka menyapu sampah, mencabut rumput, mengelap tingkap dan mengasingkan bahan yang boleh dikitar semula. Guru turut memantau aktiviti supaya semua tugas dilakukan dengan selamat.<br><br>Program tamat pada pukul 12.00 tengah hari. Kawasan sekolah menjadi lebih bersih dan ceria. Program ini juga berjaya memupuk semangat kerjasama dalam kalangan murid.<br><br>Disediakan oleh,<br><b>GORDON</b><br>Setiausaha Program Gotong-royong`]
]],
['Set 2｜Gaya Hidup Sihat',[
['Q1 Pengalaman Program Kesihatan',`Pada minggu lalu, sekolah saya telah menganjurkan Program Gaya Hidup Sihat. Saya menyertai program tersebut bersama rakan-rakan kerana ingin mengetahui cara menjaga kesihatan dengan lebih baik.<br><br>Program bermula dengan senaman ringan di dataran sekolah. Selepas itu, seorang pegawai kesihatan menyampaikan ceramah tentang pemakanan seimbang, kepentingan bersenam dan rehat yang mencukupi. Kami juga berpeluang melihat pameran berkaitan kandungan gula dalam minuman.<br><br>Aktiviti yang paling menarik ialah kuiz kesihatan secara berkumpulan. Pada mulanya kumpulan saya ketinggalan, tetapi kami berbincang dengan tenang dan berjaya menjawab soalan terakhir dengan betul. Kami berasa sangat gembira apabila diumumkan sebagai salah satu kumpulan terbaik.<br><br>Program itu memberikan banyak pengetahuan baharu kepada saya. Saya sedar bahawa kesihatan perlu dijaga melalui amalan harian yang konsisten. Saya berazam untuk bersenam dan memilih makanan yang lebih seimbang selepas mengikuti program tersebut.`],
['Q2 Faedah Gaya Hidup Sihat',`Dalam kehidupan yang semakin sibuk, amalan gaya hidup sihat perlu diberikan perhatian oleh setiap individu. Amalan ini merangkumi pemakanan seimbang, aktiviti fizikal dan rehat yang mencukupi.<br><br>Antara faedahnya ialah tubuh badan menjadi lebih cergas. Aktiviti fizikal yang dilakukan secara konsisten membantu seseorang menjadi lebih aktif dan bertenaga. Sebagai contoh, remaja boleh berjoging atau bermain badminton secara berkala. Kesannya, mereka dapat menjalani aktiviti harian dengan lebih baik.<br><br>Selain itu, gaya hidup sihat membantu mengekalkan tahap kesihatan yang baik. Pemilihan makanan yang seimbang dan penjagaan kebersihan diri dapat mengurangkan risiko masalah kesihatan. Jelaslah bahawa tabiat harian yang baik memberikan kesan positif kepada tubuh.<br><br>Gaya hidup sihat juga membantu menjaga kesejahteraan mental. Senaman dan rehat yang mencukupi dapat membantu seseorang berasa lebih tenang selepas belajar. Kesannya, tekanan dapat dikawal dengan lebih baik.<br><br>Kesimpulannya, gaya hidup sihat memberikan manfaat kepada fizikal dan mental. Oleh itu, amalan ini perlu dijadikan sebahagian daripada kehidupan seharian.`],
['Q3 Syarahan Cara Menjaga Kesihatan',`Salam sejahtera saya ucapkan kepada Tuan Pengerusi Majlis, guru-guru dan rakan-rakan sekalian. Tajuk syarahan saya pada hari ini ialah “Cara-cara Menjaga Kesihatan Diri”.<br><br>Hadirin yang dihormati,<br>Antara cara menjaga kesihatan ialah mengamalkan pemakanan yang seimbang. Kita perlu mengambil makanan daripada kumpulan yang sesuai dan mengurangkan pengambilan makanan yang terlalu manis atau berlemak. Amalan ini membantu tubuh memperoleh nutrien yang diperlukan.<br><br>Selain itu, kita hendaklah melakukan aktiviti fizikal secara berkala. Aktiviti seperti berjoging, berbasikal atau bermain badminton dapat meningkatkan kecergasan badan. Kita juga perlu mendapatkan tidur dan rehat yang mencukupi supaya tubuh serta minda dapat berfungsi dengan baik.<br><br>Akhir sekali, kebersihan diri hendaklah sentiasa dijaga. Kita perlu mandi, mencuci tangan dan memastikan persekitaran sentiasa bersih bagi mengurangkan risiko penyakit.<br><br>Hadirin sekalian, kesihatan merupakan aset yang amat bernilai. Marilah kita mengamalkan gaya hidup sihat secara konsisten. Sekian, terima kasih.`]
]],
['Set 3｜Teknologi',[
['Q1 Pengalaman Menggunakan Teknologi',`Pada minggu lalu, guru Sains memberikan tugasan berkumpulan tentang pencemaran alam sekitar. Kumpulan saya perlu menyediakan pembentangan digital dalam tempoh tiga hari.<br><br>Saya menggunakan komputer untuk mencari maklumat daripada beberapa sumber yang sesuai. Selepas itu, kami berbincang melalui aplikasi komunikasi dan membahagikan tugas. Saya menyediakan slaid manakala rakan lain mencari gambar dan menyemak fakta.<br><br>Semasa menyiapkan tugasan, sambungan Internet saya tiba-tiba terputus. Saya berasa cemas kerana beberapa bahan belum dimuat turun. Mujurlah saya telah menyimpan sebahagian maklumat lebih awal. Setelah sambungan pulih, saya segera menyelesaikan bahagian yang tertinggal.<br><br>Akhirnya, kami berjaya menghantar tugasan tepat pada waktunya dan pembentangan berjalan lancar. Pengalaman itu mengajar saya bahawa teknologi sangat membantu pembelajaran jika digunakan dengan bijak, tetapi kita juga perlu membuat persediaan menghadapi masalah teknikal.`],
['Q2 Kebaikan Internet kepada Pelajar',`Pada era digital ini, Internet menjadi kemudahan penting dalam kehidupan pelajar. Jika digunakan secara bijak, Internet dapat menyokong proses pembelajaran dengan berkesan.<br><br>Antara kebaikannya ialah pelajar dapat memperoleh maklumat dengan cepat. Mereka boleh mencari nota, artikel atau video penerangan untuk menambah pemahaman tentang sesuatu topik. Kesannya, pengetahuan mereka dapat diperkaya.<br><br>Selain itu, Internet menjadikan pembelajaran lebih menarik. Kuiz interaktif dan video pendidikan membantu pelajar memahami konsep melalui pelbagai cara. Mereka juga boleh mengulang kaji mengikut kemampuan sendiri.<br><br>Internet turut memudahkan perkongsian bahan pembelajaran. Pelajar boleh berbincang tentang tugasan dan berkongsi nota melalui platform yang sesuai. Kesannya, pembelajaran secara kolaboratif menjadi lebih mudah.<br><br>Kesimpulannya, Internet memberikan banyak manfaat kepada pelajar. Namun begitu, kemudahan ini perlu digunakan secara berhemah supaya tidak menjejaskan pelajaran dan keselamatan diri.`],
['Q3 Surat kepada Rakan tentang Internet',`No. 12, Jalan Murni 3,<br>Taman Murni,<br>14000 Bukit Mertajam,<br>Pulau Pinang.<br><br>20 Ogos 2026.<br><br>Menemui sahabatku, Amir, yang berada di Johor. Semoga saudara berada dalam keadaan sihat.<br><br>Saudara,<br>Saya ingin berkongsi beberapa cara menggunakan Internet secara bijak. Pertama, kita perlu mengehadkan masa penggunaan supaya pelajaran dan waktu rehat tidak terganggu. Jadual penggunaan boleh membantu kita mengurus masa dengan lebih baik.<br><br>Selain itu, jangan sesekali berkongsi kata laluan atau maklumat peribadi dengan orang yang tidak dikenali. Kita juga perlu menyemak kesahihan maklumat sebelum mempercayai atau menyebarkannya kepada orang lain.<br><br>Internet sepatutnya digunakan untuk tujuan yang bermanfaat seperti mencari bahan pembelajaran dan berkomunikasi dengan orang yang dikenali. Elakkan laman atau kandungan yang tidak sesuai.<br><br>Sampai di sini sahaja surat saya. Semoga pandangan ini berguna kepada saudara.<br><br>Sahabatmu,<br><b>Gordon</b>`]
]],
['Set 4｜Sukan',[
['Q1 Pengalaman Hari Sukan',`Pada hari Sabtu yang lalu, sekolah saya telah mengadakan Hari Sukan Tahunan. Seawal pukul 7.00 pagi, padang sekolah sudah dipenuhi murid, guru dan ibu bapa. Saya berasa gementar kerana akan menyertai acara lari 200 meter.<br><br>Selepas upacara perasmian dan perbarisan rumah sukan, beberapa acara bermula. Saya melakukan pemanasan bersama rakan-rakan sebelum dipanggil ke garisan permulaan.<br><br>Apabila wisel dibunyikan, saya berlari sekuat hati. Pada selekoh terakhir, seorang peserta memintas saya. Saya hampir berputus asa tetapi sorakan rakan-rakan mendorong saya untuk terus berlari. Akhirnya, saya berjaya menamatkan perlumbaan di tempat kedua.<br><br>Walaupun tidak menjadi juara, saya tetap berasa bangga kerana telah melakukan yang terbaik. Hari Sukan itu mengajar saya bahawa kejayaan memerlukan latihan, disiplin dan semangat untuk tidak mudah menyerah kalah.`],
['Q2 Kepentingan Bersukan',`Aktiviti sukan wajar dijadikan sebahagian daripada kehidupan remaja. Selain mengisi masa lapang dengan aktiviti bermanfaat, sukan memberi kesan positif terhadap perkembangan diri.<br><br>Antara kepentingan bersukan ialah meningkatkan kecergasan fizikal. Aktiviti seperti berjoging, berenang dan bermain badminton menjadikan tubuh lebih aktif dan bertenaga. Kesannya, remaja dapat menjalani aktiviti harian dengan lebih cergas.<br><br>Selain itu, sukan membentuk disiplin dan semangat kerjasama. Dalam permainan berpasukan, pemain perlu mematuhi peraturan serta bekerjasama dengan rakan. Pengalaman ini membantu membentuk sahsiah yang baik.<br><br>Sukan juga membantu mengurangkan tekanan. Selepas belajar, remaja boleh melakukan aktiviti rekreasi untuk merehatkan minda. Kesannya, mereka berasa lebih tenang dan dapat kembali belajar dengan lebih fokus.<br><br>Kesimpulannya, bersukan penting untuk perkembangan fizikal dan mental remaja. Oleh itu, remaja perlu melibatkan diri dalam aktiviti sukan secara konsisten.`],
['Q3 Laporan Kejohanan Sukan Tahunan',`<b>LAPORAN KEJOHANAN SUKAN TAHUNAN</b><br><br>Pada 10 Julai 2026, sekolah saya telah mengadakan Kejohanan Sukan Tahunan di padang sekolah. Program bermula pada pukul 7.30 pagi dan disertai oleh semua rumah sukan.<br><br>Majlis dimulakan dengan perbarisan rumah sukan dan ucapan perasmian oleh pengetua. Selepas itu, acara balapan dan padang seperti lari 100 meter, 200 meter dan lompat jauh dijalankan mengikut jadual.<br><br>Para peserta menunjukkan semangat kesukanan yang tinggi. Murid lain memberikan sokongan kepada rumah sukan masing-masing sambil mematuhi arahan guru. Guru bertugas memastikan setiap acara berlangsung dengan teratur dan selamat.<br><br>Kejohanan tamat dengan acara penyampaian hadiah. Program ini berjaya mencungkil bakat murid serta memupuk disiplin dan semangat kerjasama.<br><br>Disediakan oleh,<br><b>GORDON</b><br>Setiausaha Kejohanan Sukan`]
]],
['Set 5｜Alam Sekitar',[
['Q1 Pengalaman Kempen Kitar Semula',`Pada minggu lalu, sekolah saya telah menganjurkan Kempen Kitar Semula. Saya dan rakan-rakan menyertai kempen tersebut kerana ingin membantu mengurangkan jumlah bahan buangan di sekolah.<br><br>Pada awal program, guru menerangkan cara mengasingkan kertas, plastik dan kaca. Kami kemudian bergerak dari kelas ke kelas untuk mengumpulkan bahan yang boleh dikitar semula.<br><br>Semasa mengasingkan bahan, kami mendapati banyak botol plastik bercampur dengan sisa makanan. Kami memakai sarung tangan dan membersihkannya sebelum memasukkan botol ke dalam bekas yang betul. Walaupun tugas itu agak kotor, kami terus bekerjasama sehingga selesai.<br><br>Pada akhir kempen, sejumlah besar bahan berjaya dikumpulkan. Saya berasa bangga kerana usaha kecil kami dapat membantu menjaga alam sekitar. Pengalaman itu menyedarkan saya bahawa amalan kitar semula perlu dilakukan secara berterusan, bukan hanya ketika kempen berlangsung.`],
['Q2 Langkah Menjaga Alam Sekitar',`Alam sekitar yang bersih penting untuk kesejahteraan manusia. Oleh itu, beberapa langkah perlu dilakukan secara konsisten untuk memelihara persekitaran.<br><br>Antara langkah yang berkesan ialah mengamalkan konsep 3R, iaitu mengurangkan, menggunakan semula dan mengitar semula. Kertas, plastik dan kaca boleh diasingkan ke dalam tong yang sesuai. Kesannya, jumlah sisa dapat dikurangkan.<br><br>Selain itu, masyarakat hendaklah membuang sampah di tempat yang betul. Sikap membuang sampah sesuka hati boleh mencemarkan kawasan dan saliran. Penggunaan tong sampah yang disediakan dapat memastikan persekitaran sentiasa bersih.<br><br>Kita juga boleh mengurangkan penggunaan barangan sekali guna. Sebagai contoh, kita boleh membawa botol minuman dan beg guna semula. Tindakan ini membantu mengurangkan penggunaan plastik yang berlebihan.<br><br>Kesimpulannya, penjagaan alam sekitar memerlukan tindakan semua pihak. Jika amalan ini dilakukan secara berterusan, persekitaran yang bersih dapat dikekalkan untuk generasi akan datang.`],
['Q3 Ucapan Kepentingan Menjaga Alam Sekitar',`Salam sejahtera saya ucapkan kepada guru-guru dan rakan-rakan sekalian. Pada hari ini, saya ingin menyampaikan ucapan tentang kepentingan menjaga alam sekitar.<br><br>Hadirin sekalian,<br>Alam sekitar yang bersih penting untuk kesihatan manusia. Persekitaran yang tidak tercemar dapat mengurangkan risiko gangguan kesihatan dan menjadikan kehidupan lebih selesa.<br><br>Selain itu, penjagaan alam sekitar penting untuk memastikan sumber semula jadi dapat digunakan secara berterusan. Penggunaan sumber secara berhemah dapat mengurangkan pembaziran dan melindungi alam untuk generasi akan datang.<br><br>Alam sekitar yang terpelihara juga mewujudkan kawasan yang indah dan selesa. Taman, sungai dan kawasan hijau yang bersih boleh digunakan untuk aktiviti rekreasi serta memberikan ketenangan kepada masyarakat.<br><br>Hadirin yang dihormati, jelaslah bahawa penjagaan alam sekitar memberikan manfaat kepada semua. Marilah kita memainkan peranan masing-masing demi mewujudkan persekitaran yang bersih dan lestari. Sekian, terima kasih.`]
]],
['Set 6｜Perpaduan',[
['Q1 Pengalaman Aktiviti Perpaduan',`Pada bulan lalu, sekolah saya telah mengadakan Program Muhibah untuk mengeratkan hubungan antara murid pelbagai kaum. Saya menyertai program itu bersama rakan-rakan sekelas.<br><br>Kami dibahagikan kepada kumpulan yang terdiri daripada murid pelbagai latar belakang. Aktiviti pertama ialah permainan berkumpulan yang memerlukan kami menyelesaikan beberapa tugasan secara bersama-sama.<br><br>Pada mulanya, kumpulan kami sukar membuat keputusan kerana masing-masing mempunyai cadangan berbeza. Namun, kami akhirnya belajar mendengar pandangan setiap ahli dan membahagikan tugas mengikut kemampuan. Hasil kerjasama itu, kami berjaya menyelesaikan cabaran dalam masa yang ditetapkan.<br><br>Selepas aktiviti, kami makan bersama dan berkongsi cerita tentang budaya masing-masing. Saya berasa gembira kerana dapat mengenali rakan-rakan dengan lebih dekat. Program itu mengajar saya bahawa sikap saling menghormati dan bekerjasama merupakan asas kepada perpaduan.`],
['Q2 Cara Memupuk Perpaduan',`Malaysia terdiri daripada masyarakat yang mempunyai pelbagai latar belakang. Oleh itu, perpaduan perlu dipupuk sejak bangku sekolah agar murid dapat belajar dalam suasana yang harmoni.<br><br>Antara caranya ialah menggalakkan murid menyertai aktiviti sekolah secara bersama-sama. Sukan, gotong-royong dan aktiviti kelab memberi peluang kepada murid untuk berinteraksi. Kesannya, mereka dapat mengenali rakan daripada latar belakang yang berbeza.<br><br>Selain itu, murid hendaklah menghormati budaya dan adat masyarakat lain. Sikap ini dapat mengelakkan salah faham. Sebagai contoh, murid boleh mempelajari perayaan masyarakat lain tanpa memperlekehkan perbezaan.<br><br>Budaya bekerjasama tanpa mengira kaum juga perlu diamalkan. Murid boleh saling membantu dalam pelajaran dan aktiviti sekolah. Kesannya, hubungan persahabatan menjadi lebih erat.<br><br>Kesimpulannya, perpaduan dalam kalangan murid dapat dipupuk melalui interaksi, sikap hormat dan kerjasama. Amalan ini perlu dilakukan secara berterusan.`],
['Q3 Rencana Kepentingan Perpaduan',`<b>KEPENTINGAN PERPADUAN DALAM MASYARAKAT</b><br><i>Oleh: Gordon</i><br><br>Malaysia terkenal sebagai negara yang mempunyai masyarakat berbilang kaum dan budaya. Dalam keadaan ini, perpaduan amat penting untuk memastikan rakyat dapat hidup bersama secara aman dan harmoni.<br><br>Antara kepentingan perpaduan ialah mewujudkan keamanan dalam masyarakat. Apabila rakyat saling menghormati dan memahami perbezaan, perselisihan dapat dielakkan. Kesannya, kehidupan harian dapat dijalankan dalam suasana yang tenteram.<br><br>Selain itu, perpaduan memudahkan masyarakat bekerjasama. Penduduk yang mempunyai hubungan baik lebih mudah berganding bahu dalam aktiviti kejiranan, kebajikan dan pembangunan komuniti. Kerjasama ini dapat menyelesaikan masalah dengan lebih berkesan.<br><br>Perpaduan juga penting kepada kestabilan dan kemajuan negara. Masyarakat yang bersatu dapat menumpukan tenaga kepada pendidikan, ekonomi dan pembangunan tanpa diganggu konflik yang tidak perlu.<br><br>Kesimpulannya, perpaduan merupakan asas kepada masyarakat yang aman dan negara yang stabil. Oleh itu, setiap rakyat perlu memelihara hubungan baik dan menghormati kepelbagaian yang menjadi kekuatan negara.`]
]]];
let tabs=document.getElementById('tabs');sets.forEach((s,i)=>{let b=document.createElement('button');b.className='btn';b.textContent='Set '+(i+1);b.onclick=()=>show(i);tabs.appendChild(b)});function show(i){[...tabs.children].forEach((b,j)=>b.classList.toggle('on',i===j));let s=sets[i],h=`<h2>${s[0]}</h2>`;s[1].forEach((q,j)=>{h+=`<section class="box"><h3>${q[0]}</h3><p class="q"><b>写作前：</b>先判断 Jenis + Kata Tugas，再列 3 个核心内容。</p><button class="btn show" onclick="let e=document.getElementById('e${i}${j}');e.style.display=e.style.display==='block'?'none':'block'">显示 / 隐藏完整范文</button><div class="essay" id="e${i}${j}">${q[1]}</div></section>`});document.getElementById('out').innerHTML=h}show(0)</script></body></html>
