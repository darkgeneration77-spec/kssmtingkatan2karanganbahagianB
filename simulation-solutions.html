<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set 1–6 完整答案系统</title><style>body{font-family:Arial,'Microsoft YaHei',sans-serif;background:#f7f5ef;color:#20252b;margin:0;line-height:1.72}.w{max-width:1050px;margin:auto;padding:24px}.set,.q{background:#fff;border:1px solid #ddd8cc;border-radius:18px;padding:20px;margin:15px 0}.q{background:#fafafa}.plan{background:#eef3f4;padding:13px;border-radius:12px}.essay{background:#fff8ea;border-left:5px solid #b58a43;padding:16px;border-radius:10px}.risk{background:#fff1ef;padding:12px;border-radius:10px}.alt{background:#edf7ef;padding:12px;border-radius:10px}.btn{display:inline-block;padding:9px 13px;border:1px solid #ccc;border-radius:10px;background:#fff;text-decoration:none;color:inherit;cursor:pointer}.answer{display:none}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.tabs button{padding:9px 12px;border:1px solid #ccc;border-radius:10px;background:#fff}.tabs .on{background:#315f72;color:#fff}@media print{.nav,.tabs,.reveal{display:none}.answer{display:block}.set{break-before:page}}</style></head><body><main class="w"><div class="nav"><a class="btn" href="teacher.html">← 教师中心</a> <button class="btn" onclick="print()">打印 / PDF</button></div><h1>Phase 5｜Set 1–6 完整答案系统</h1><p>每套：三题审题 → Planning → 推荐路线 → 一篇完整高分范文 → 其余两题可接受 Isi → 常见离题点。范文用于分析结构，不是要求学生逐字背诵。</p><div class="tabs" id="tabs"></div><div id="out"></div></main><script>
const S=[
{t:'Set 1｜Kebersihan Sekolah',qs:['Pengalaman gotong-royong','Langkah menjaga kebersihan sekolah','Laporan Program Gotong-royong'],rec:'Q1 Pengalaman',plan:'Latar program → pembahagian tugas → membersihkan kawasan → rakan hampir tergelincir → selesai → perasaan/pengajaran',essay:`Pada pagi Sabtu yang lalu, sekolah saya telah mengadakan Program Gotong-royong Perdana. Seawal pukul 7.30 pagi, saya dan rakan-rakan berkumpul di dataran sekolah dengan penuh semangat. Selepas guru memberikan taklimat ringkas, kami dibahagikan kepada beberapa kumpulan.<br><br>Kumpulan saya ditugaskan membersihkan taman dan kawasan longkang. Saya menyapu daun-daun kering manakala beberapa orang rakan mengutip sampah dan mencabut rumput. Kami bekerjasama tanpa banyak mengeluh walaupun cuaca semakin panas.<br><br>Ketika membersihkan longkang, Amir tiba-tiba tergelincir dan hampir terjatuh. Saya segera memegang tangannya sementara rakan lain memanggil guru. Mujurlah Amir tidak mengalami kecederaan serius. Selepas berehat seketika, kami meneruskan tugas dengan lebih berhati-hati.<br><br>Menjelang tengah hari, kawasan sekolah kelihatan bersih dan ceria. Walaupun keletihan, saya berasa puas hati kerana dapat menyumbang tenaga. Pengalaman tersebut mengajar saya bahawa kerjasama dan sikap bertanggungjawab amat penting dalam menjaga kebersihan sekolah.`,alt:'Q2: buang sampah di tempat betul; gotong-royong; menjaga kebersihan kelas. Q3: tarikh/tempat/peserta; aktiviti; hasil program.',risk:'Q1 jangan变成 langkah 列表；Q2 所有 Isi 必须是行动；Q3 不能忘记 laporan 的格式。'},
{t:'Set 2｜Gaya Hidup Sihat',qs:['Pengalaman program kesihatan','Faedah gaya hidup sihat','Syarahan cara menjaga kesihatan'],rec:'Q2 Fakta/Pendapat',plan:'Pendahuluan → badan cergas → mengurangkan risiko masalah kesihatan → kesihatan mental lebih baik → Penutup',essay:`Dalam kehidupan yang semakin sibuk, amalan gaya hidup sihat perlu diberikan perhatian oleh setiap individu. Amalan ini bukan sahaja berkaitan dengan pemakanan, malah merangkumi aktiviti fizikal dan rehat yang mencukupi. Oleh itu, gaya hidup sihat membawa pelbagai faedah kepada kita.<br><br>Antara faedah utama gaya hidup sihat ialah tubuh badan menjadi lebih cergas. Pemakanan seimbang dan aktiviti fizikal yang dilakukan secara konsisten membekalkan tenaga yang diperlukan oleh badan. Sebagai contoh, remaja boleh bersenam atau berjoging beberapa kali seminggu. Kesannya, mereka lebih bertenaga untuk menjalani aktiviti harian.<br><br>Selain itu, gaya hidup sihat membantu kita mengekalkan tahap kesihatan yang baik. Pengambilan makanan yang sesuai serta penjagaan kebersihan diri dapat membantu mengurangkan risiko masalah kesihatan. Sebagai contoh, kita perlu mengurangkan makanan yang terlalu manis atau berlemak dan memilih makanan yang seimbang. Jelaslah bahawa tabiat harian yang baik memberi kesan positif kepada kesihatan.<br><br>Gaya hidup sihat juga membantu menjaga kesejahteraan mental. Aktiviti rekreasi, senaman dan rehat yang mencukupi dapat membantu seseorang berasa lebih tenang selepas belajar atau bekerja. Kesannya, tekanan dapat dikawal dengan lebih baik.<br><br>Kesimpulannya, gaya hidup sihat memberikan banyak manfaat kepada fizikal dan mental. Oleh itu, kita hendaklah mengamalkannya secara konsisten agar dapat menjalani kehidupan yang lebih sihat dan berkualiti.`,alt:'Q1: pemeriksaan/ceramah/senaman; aktiviti menarik; perasaan dan pengajaran. Q3: bersenam; makan seimbang; tidur cukup; jaga kebersihan.',risk:'Q2 问 faedah，不要三段都写“kita hendaklah”。Q3 必须有 sapaan 和 syarahan 语气。'},
{t:'Set 3｜Teknologi',qs:['Pengalaman teknologi menyiapkan tugasan','Kebaikan Internet kepada pelajar','Surat cara menggunakan Internet secara bijak'],rec:'Q2 Fakta/Pendapat',plan:'Pendahuluan → mendapatkan maklumat → pembelajaran lebih menarik → komunikasi/perkongsian bahan → Penutup',essay:`Pada era digital ini, Internet telah menjadi salah satu kemudahan yang penting dalam kehidupan pelajar. Jika digunakan dengan bijak, kemudahan ini dapat menyokong proses pembelajaran dengan berkesan. Terdapat pelbagai kebaikan Internet kepada pelajar.<br><br>Antara kebaikan Internet ialah pelajar dapat memperoleh maklumat dengan cepat. Pelbagai bahan pendidikan boleh dicari untuk menambah pemahaman tentang sesuatu topik. Sebagai contoh, pelajar boleh mencari nota, artikel atau video penerangan berkaitan mata pelajaran yang dipelajari. Kesannya, pengetahuan mereka dapat diperkaya.<br><br>Selain itu, Internet menjadikan pembelajaran lebih menarik. Bahan digital seperti kuiz interaktif dan video pendidikan dapat membantu pelajar memahami konsep yang sukar. Kaedah ini juga membolehkan mereka mengulang kaji mengikut kemampuan sendiri. Jelaslah bahawa Internet dapat mempelbagaikan cara pembelajaran.<br><br>Internet turut memudahkan pelajar berkongsi bahan pembelajaran. Mereka boleh berbincang tentang tugasan dan berkongsi nota melalui platform yang sesuai. Kesannya, proses pembelajaran secara kolaboratif menjadi lebih mudah.<br><br>Kesimpulannya, Internet memberikan banyak manfaat kepada pelajar jika digunakan secara berhemah. Oleh itu, pelajar haruslah memanfaatkan teknologi untuk tujuan yang berfaedah dan mengelakkan penggunaan yang boleh menjejaskan pelajaran.`,alt:'Q1: menerima tugasan; mencari sumber; masalah sambungan/maklumat; menyiapkan dan menghantar; pengajaran. Q3: had masa; lindungi maklumat peribadi; semak kesahihan maklumat; elak laman tidak sesuai.',risk:'Q2 必须写 kebaikan；Q3 是 surat kepada rakan，语气和格式必须匹配。'},
{t:'Set 4｜Sukan',qs:['Pengalaman Hari Sukan','Kepentingan bersukan kepada remaja','Laporan Kejohanan Sukan Tahunan'],rec:'Q2 Fakta/Pendapat',plan:'Pendahuluan → kesihatan fizikal → disiplin/kerjasama → mengurangkan tekanan → Penutup',essay:`Aktiviti sukan wajar dijadikan sebahagian daripada kehidupan remaja. Selain mengisi masa lapang dengan aktiviti yang bermanfaat, sukan memberikan kesan positif terhadap perkembangan diri. Oleh itu, kepentingan bersukan kepada remaja tidak boleh dipandang ringan.<br><br>Antara kepentingan bersukan ialah meningkatkan kecergasan fizikal. Pergerakan yang dilakukan ketika bersukan menjadikan tubuh lebih aktif dan bertenaga. Sebagai contoh, remaja boleh berjoging, berenang atau bermain badminton secara berkala. Kesannya, mereka dapat menjalani aktiviti harian dengan lebih cergas.<br><br>Selain itu, sukan dapat membentuk disiplin dan semangat kerjasama. Dalam permainan berpasukan, setiap pemain perlu mematuhi peraturan serta bekerjasama dengan rakan. Sebagai contoh, pemain bola sepak perlu melaksanakan peranan masing-masing untuk mencapai matlamat pasukan. Jelaslah bahawa sukan turut membantu membentuk sahsiah yang baik.<br><br>Aktiviti sukan juga dapat membantu mengurangkan tekanan. Selepas belajar, remaja boleh melakukan aktiviti rekreasi untuk merehatkan minda. Kesannya, mereka berasa lebih tenang dan dapat kembali belajar dengan lebih fokus.<br><br>Kesimpulannya, bersukan penting untuk perkembangan fizikal dan mental remaja. Oleh itu, remaja haruslah melibatkan diri dalam aktiviti sukan secara konsisten agar menjadi generasi yang sihat, aktif dan berdisiplin.`,alt:'Q1: persediaan; perbarisan/acara; pertandingan; kemuncak; keputusan/perasaan. Q3: tarikh/tempat; acara; penyertaan; keputusan/penutup.',risk:'Kepentingan bukan cara menggalakkan sukan。Laporan不能写成第一人称故事流水账。'},
{t:'Set 5｜Alam Sekitar',qs:['Pengalaman kempen kitar semula','Langkah menjaga alam sekitar','Ucapan kepentingan menjaga alam sekitar'],rec:'Q2 Fakta/Pendapat',plan:'Pendahuluan → amalan 3R → elak pembuangan sampah → kurangkan penggunaan bahan sekali guna → Penutup',essay:`Alam sekitar yang bersih amat penting untuk kesejahteraan manusia. Namun begitu, pencemaran boleh berlaku jika masyarakat tidak menjaga persekitaran dengan bertanggungjawab. Oleh itu, beberapa langkah perlu dilakukan untuk memelihara alam sekitar.<br><br>Antara langkah yang berkesan ialah mengamalkan konsep 3R, iaitu mengurangkan, menggunakan semula dan mengitar semula. Melalui amalan ini, jumlah bahan buangan dapat dikurangkan. Sebagai contoh, kertas, plastik dan kaca boleh diasingkan ke dalam tong kitar semula. Kesannya, jumlah sisa yang dibuang dapat dikawal.<br><br>Selain itu, masyarakat hendaklah membuang sampah di tempat yang betul. Sikap membuang sampah sesuka hati boleh mencemarkan kawasan persekitaran dan saliran. Sebagai contoh, setiap individu perlu menggunakan tong sampah yang disediakan ketika berada di sekolah atau tempat awam. Langkah ini dapat memastikan kawasan sentiasa bersih.<br><br>Kita juga boleh mengurangkan penggunaan barangan sekali guna. Sebagai contoh, kita boleh membawa botol minuman dan beg guna semula ketika membeli-belah. Tindakan ini membantu mengurangkan penggunaan plastik yang berlebihan.<br><br>Kesimpulannya, penjagaan alam sekitar memerlukan tindakan yang konsisten daripada semua pihak. Jika setiap individu memainkan peranan, persekitaran yang bersih dan selesa dapat dikekalkan untuk generasi akan datang.`,alt:'Q1: taklimat; mengasingkan bahan; pertandingan/pengumpulan; hasil; perasaan. Q3 kepentingan: kesihatan; keselesaan; kelestarian sumber/masa depan.',risk:'Q2 问 langkah，不能把“alam sekitar menjadi bersih”当作 Isi。Q3 问 kepentingan，不是 cara。'},
{t:'Set 6｜Perpaduan',qs:['Pengalaman aktiviti perpaduan','Cara memupuk perpaduan dalam kalangan murid','Rencana kepentingan perpaduan'],rec:'Q2 Fakta/Pendapat',plan:'Pendahuluan → aktiviti bersama → hormati budaya → kerjasama tanpa mengira kaum → Penutup',essay:`Malaysia terdiri daripada masyarakat yang mempunyai pelbagai latar belakang. Oleh itu, perpaduan perlu dipupuk sejak bangku sekolah agar murid dapat hidup dan belajar dalam suasana yang harmoni. Terdapat beberapa cara yang boleh dilakukan untuk memupuk perpaduan dalam kalangan murid.<br><br>Antara caranya ialah menggalakkan murid menyertai aktiviti sekolah secara bersama-sama. Aktiviti seperti sukan, gotong-royong dan kelab memberi peluang kepada murid untuk berinteraksi serta bekerjasama. Sebagai contoh, murid daripada pelbagai kaum boleh ditempatkan dalam kumpulan yang sama semasa menjalankan projek. Kesannya, mereka dapat mengenali dan memahami rakan dengan lebih baik.<br><br>Selain itu, murid hendaklah menghormati budaya dan adat masyarakat lain. Sikap ini dapat mengelakkan salah faham serta mewujudkan hubungan yang baik. Sebagai contoh, murid boleh mempelajari amalan dan perayaan masyarakat lain tanpa memperlekehkan perbezaan. Jelaslah bahawa sikap saling menghormati dapat mengukuhkan perpaduan.<br><br>Di samping itu, budaya bekerjasama tanpa mengira kaum perlu diamalkan. Murid boleh saling membantu dalam pelajaran dan aktiviti sekolah. Kesannya, hubungan persahabatan menjadi lebih erat dan semangat kekitaan dapat dipupuk.<br><br>Kesimpulannya, perpaduan dalam kalangan murid perlu dibina melalui interaksi, sikap hormat dan kerjasama. Jika amalan ini dipupuk secara berterusan, sekolah dapat menjadi tempat yang aman dan harmoni untuk semua.`,alt:'Q1: aktiviti berkumpulan; berkenalan; bekerjasama; cabaran; hasil/perasaan. Q3 kepentingan: keamanan; kerjasama masyarakat; kestabilan/kemajuan.',risk:'Q2 bagaimanakah = cara。Q3 kepentingan = 为什么重要，不能把 Q2 的方法原封不动搬过去。'}];
let tabs=document.getElementById('tabs');S.forEach((s,i)=>{let b=document.createElement('button');b.textContent='Set '+(i+1);b.onclick=()=>show(i);tabs.appendChild(b)});function show(i){[...tabs.children].forEach((b,j)=>b.classList.toggle('on',i===j));let s=S[i];document.getElementById('out').innerHTML=`<section class="set"><h2>${s.t}</h2><div class="q"><b>三题审题</b><p>Q1：${s.qs[0]}<br>Q2：${s.qs[1]}<br>Q3：${s.qs[2]}</p><p><b>示范推荐：</b>${s.rec}。注意：真实考场没有固定“最佳题”，学生应选择自己最能列出内容、最稳格式的一题。</p></div><button class="btn reveal" onclick="document.getElementById('ans').style.display='block'">显示完整教师答案</button><div class="answer" id="ans"><h3>Planning</h3><p class="plan">${s.plan}</p><h3>完整高分范文</h3><div class="essay">${s.essay}</div><h3>其余题目可接受 Isi</h3><p class="alt">${s.alt}</p><h3>常见离题点</h3><p class="risk">${s.risk}</p><h3>批改检查</h3><p>□ Kehendak tepat　□ Isi relevan　□ Huraian berkembang　□ Contoh sesuai　□ Kesan/Penegasan jelas　□ Pendahuluan masuk tema　□ Penutup tidak tambah isi baharu　□ Bahasa gramatis dan ejaan tepat</p></div></section>`}show(0)</script></body></html>
