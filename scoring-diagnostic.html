<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作文评分诊断器｜Form 2 BM</title><style>body{font-family:Arial,'Microsoft YaHei',sans-serif;background:#f7f5ef;color:#20252b;margin:0;line-height:1.65}.w{max-width:1000px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #ddd8cc;border-radius:18px;padding:20px;margin:14px 0}.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.row{display:grid;grid-template-columns:220px 1fr 70px;gap:12px;align-items:center;margin:16px 0}.score{font-size:1.3rem;font-weight:bold;text-align:center}.result{background:#eef3f4;border-radius:15px;padding:18px}.weak{background:#fff1ef;border-left:5px solid #b85c4d;padding:12px;margin:8px 0}.good{background:#edf7ef;border-left:5px solid #548565;padding:12px;margin:8px 0}.attempt{background:#fffaf0;border-left:5px solid #b58a43;padding:16px;border-radius:10px;white-space:pre-wrap}.btn{display:inline-block;padding:9px 13px;border:1px solid #ccc;border-radius:10px;background:#fff;text-decoration:none;color:inherit;cursor:pointer}input[type=range]{width:100%}textarea,input[type=text],select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:9px;background:#fff}@media(max-width:650px){.row,.meta{grid-template-columns:1fr}.score{text-align:left}}</style></head><body><main class="w"><a class="btn" href="teacher.html">← 教师中心</a><h1>作文评分诊断器</h1><p>如果从 Simulation 进入，学生、Set、Tema、Jenis 和原作文会自动带进来。终于不用把同一份资料抄两次。</p><section class="card" id="attemptBox" style="display:none"><h2>学生原作</h2><p><b id="attemptInfo"></b></p><div class="attempt" id="attemptText"></div></section><section class="card"><div class="meta"><label>学生<input id="name" type="text" placeholder="Nama murid"></label><label>Set<select id="set"><option value="Independent">Independent / 其他</option><option>Set 1</option><option>Set 2</option><option>Set 3</option><option>Set 4</option><option>Set 5</option><option>Set 6</option></select></label><label>Tema<select id="theme"><option>Diri & Remaja</option><option>Keluarga</option><option>Sekolah & Pendidikan</option><option>Kesihatan</option><option>Alam Sekitar</option><option>Teknologi & Internet</option><option>Sukan & Rekreasi</option><option>Keselamatan</option><option>Masyarakat & Kejiranan</option><option>Perpaduan</option><option>Patriotisme</option><option>Nilai Murni</option><option>Sekolah & Kebersihan</option></select></label><label>Jenis<select id="genre"><option>Fakta / Pendapat</option><option>Pengalaman</option><option>Cerita</option><option>Surat Rasmi</option><option>Surat Tidak Rasmi</option><option>Laporan</option><option>Syarahan / Ucapan / Ceramah</option><option>Rencana</option><option>Berita</option><option>Catatan</option><option>Wawancara / Dialog</option></select></label></div><div class="row"><b>Kehendak Soalan<br><small>审题与切题</small></b><input id="k" type="range" min="0" max="5" value="3" oninput="calc()"><span class="score" id="ks">3/5</span></div><div class="row"><b>Isi & Huraian<br><small>内容与展开</small></b><input id="i" type="range" min="0" max="5" value="3" oninput="calc()"><span class="score" id="is">3/5</span></div><div class="row"><b>Bahasa<br><small>语法、词汇、ejaan</small></b><input id="b" type="range" min="0" max="5" value="3" oninput="calc()"><span class="score" id="bs">3/5</span></div><div class="row"><b>Organisasi / Format<br><small>段落、衔接、格式</small></b><input id="o" type="range" min="0" max="5" value="3" oninput="calc()"><span class="score" id="os">3/5</span></div><label>教师备注<textarea id="note" rows="4" placeholder="具体指出问题，不写‘多努力’这种无法操作的神秘指令。"></textarea></label><p><button class="btn" onclick="calc()">生成诊断</button> <button class="btn" onclick="save()">保存评分记录</button> <button class="btn" onclick="print()">打印 / PDF</button> <a class="btn" href="student-progress.html">查看进度</a></p></section><section class="card result"><h2>诊断结果：<span id="total">12/20</span></h2><div id="diag"></div></section><section class="card"><p><b>说明：</b>0–5 是教学诊断等级，不把 20 分机械冒充成官方 Bahagian B 30 分。用途是找出下一步训练位置。</p></section></main><script>let pending=null;function weakList(v){let a=[];if(v.k<=2)a.push('Kehendak');if(v.i<=2)a.push('Isi & Huraian');if(v.b<=2)a.push('Bahasa');if(v.o<=2)a.push('Organisasi / Format');return a}function calc(){let v={k:+k.value,i:+i.value,b:+b.value,o:+o.value};ks.textContent=v.k+'/5';is.textContent=v.i+'/5';bs.textContent=v.b+'/5';os.textContent=v.o+'/5';total.textContent=(v.k+v.i+v.b+v.o)+'/20';let d='';if(v.k<=2)d+=`<div class="weak"><b>Kehendak 弱：</b>先做 Kata Tugas 分类。<br><a href="task-transform.html">题型转换 →</a></div>`;else d+=`<div class="good">Kehendak 基本稳定。</div>`;if(v.i<=2)d+=`<div class="weak"><b>Isi/Huraian 弱：</b>练 Topik → Huraian → Contoh → Kesan → Penegasan。<br><a href="training-ladder.html">Level 3–4 →</a></div>`;if(v.b<=2)d+=`<div class="weak"><b>Bahasa 弱：</b>修正 nahu、ejaan、tanda baca，再增加句式变化。<br><a href="checklist.html">语言检查 →</a></div>`;if(v.o<=2)d+=`<div class="weak"><b>Organisasi/Format 弱：</b>检查段落与文体外壳。<br><a href="format-lab.html">格式实验室 →</a></div>`;if(v.k>=3&&v.i>=3&&v.b>=3&&v.o>=3)d+=`<div class="good"><b>整体基本稳定。</b>继续完整模拟，提高内容成熟度与准确性。</div>`;diag.innerHTML=d}function loadPending(){try{pending=JSON.parse(localStorage.getItem('bmPendingAttempt')||'null')}catch(e){}if(!pending)return;attemptBox.style.display='block';attemptInfo.textContent=`${pending.set} · ${pending.question} · ${pending.jenis} · ${pending.words||0} words`;attemptText.textContent=pending.essay||'';name.value=pending.student||'';set.value=pending.set||'Independent';theme.value=pending.tema||theme.value;genre.value=pending.jenis||genre.value}function save(){let v={k:+k.value,i:+i.value,b:+b.value,o:+o.value},a=JSON.parse(localStorage.getItem('bmScores')||'[]');a.push({id:Date.now(),date:new Date().toLocaleString(),name:name.value.trim(),set:set.value,theme:theme.value,genre:genre.value,question:pending?.question||'',words:pending?.words||'',essay:pending?.essay||'',k:v.k,i:v.i,b:v.b,o:v.o,total:v.k+v.i+v.b+v.o,weak:weakList(v),note:note.value.trim()});localStorage.setItem('bmScores',JSON.stringify(a));localStorage.removeItem('bmPendingAttempt');alert('评分、作文与诊断已经保存。');location.href='student-progress.html'}loadPending();calc()</script></body></html>
