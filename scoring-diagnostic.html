<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作文评分诊断器｜Form 2 BM</title><style>body{font-family:Arial,'Microsoft YaHei',sans-serif;background:#f7f5ef;color:#20252b;margin:0;line-height:1.65}.w{max-width:1000px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #ddd8cc;border-radius:18px;padding:20px;margin:14px 0}.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.row{display:grid;grid-template-columns:220px 1fr 70px;gap:12px;align-items:center;margin:16px 0}.score{font-size:1.3rem;font-weight:bold;text-align:center}.result{background:#eef3f4;border-radius:15px;padding:18px}.weak{background:#fff1ef;border-left:5px solid #b85c4d;padding:12px;margin:8px 0}.good{background:#edf7ef;border-left:5px solid #548565;padding:12px;margin:8px 0}.attempt{background:#fffaf0;border-left:5px solid #b58a43;padding:16px;border-radius:10px;white-space:pre-wrap}.btn{display:inline-block;padding:9px 13px;border:1px solid #ccc;border-radius:10px;background:#fff;text-decoration:none;color:inherit;cursor:pointer}input[type=range]{width:100%}textarea,input[type=text],select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:9px;background:#fff}@media(max-width:650px){.row,.meta{grid-template-columns:1fr}.score{text-align:left}.w{padding:14px}}@media print{.nav,.actions{display:none!important}.card{break-inside:avoid}body{background:#fff}.w{max-width:none;padding:0}}</style></head><body><main class="w"><div class="nav"><a class="btn" href="teacher.html">← 教师中心</a> <a class="btn" href="index.html">主页</a></div><h1>作文评分诊断器</h1><p>如果从 Simulation 进入，学生、Set、Tema、Jenis 和原作文会自动带入。四维分数用于教学诊断，不是官方 Bahagian B 评分表。</p><section class="card" id="attemptBox" style="display:none"><h2>学生原作</h2><p><b id="attemptInfo"></b></p><div class="attempt" id="attemptText"></div></section><section class="card"><div class="meta"><label>学生<input id="name" type="text" placeholder="Nama murid"></label><label>Set<select id="set"><option value="Independent">Independent / 其他</option><option>Set 1</option><option>Set 2</option><option>Set 3</option><option>Set 4</option><option>Set 5</option><option>Set 6</option></select></label><label>Tema<select id="theme"><option>Diri & Remaja</option><option>Keluarga</option><option>Sekolah & Pendidikan</option><option>Kesihatan</option><option>Alam Sekitar</option><option>Teknologi & Internet</option><option>Sukan & Rekreasi</option><option>Keselamatan</option><option>Masyarakat & Kejiranan</option><option>Perpaduan</option><option>Patriotisme</option><option>Nilai Murni</option></select></label><label>Jenis<select id="genre"><option>Fakta / Pendapat</option><option>Pengalaman</option><option>Cerita</option><option>Surat Rasmi</option><option>Surat Tidak Rasmi</option><option>Laporan</option><option>Syarahan / Ucapan / Ceramah</option><option>Rencana</option><option>Berita</option><option>Catatan</option><option>Wawancara / Dialog</option></select></label></div><div class="row"><b>Kehendak Soalan<br><small>审题与切题</small></b><input id="k" type="range" min="0" max="5" value="3"><span class="score" id="ks">3/5</span></div><div class="row"><b>Isi & Huraian<br><small>内容与展开</small></b><input id="i" type="range" min="0" max="5" value="3"><span class="score" id="is">3/5</span></div><div class="row"><b>Bahasa<br><small>语法、词汇、ejaan</small></b><input id="b" type="range" min="0" max="5" value="3"><span class="score" id="bs">3/5</span></div><div class="row"><b>Organisasi / Format<br><small>段落、衔接、格式</small></b><input id="o" type="range" min="0" max="5" value="3"><span class="score" id="os">3/5</span></div><label>教师备注<textarea id="note" rows="4" placeholder="写可执行反馈，例如：第二段 Ayat Topik 写成 faedah，但题目问 langkah。"></textarea></label><p class="actions"><button class="btn" id="calcBtn">生成诊断</button> <button class="btn" id="saveBtn">保存评分记录</button> <button class="btn" onclick="print()">打印 / PDF</button> <a class="btn" href="student-progress.html">查看进度</a></p></section><section class="card result"><h2>诊断结果：<span id="total">12/20</span></h2><div id="diag"></div></section><section class="card"><p><b>说明：</b>0–5 是教学诊断等级。它的用途是找出下一步训练位置，而不是把 20 分机械换算成官方 30 分。</p></section></main><script>(()=>{const $=id=>document.getElementById(id),K=$('k'),I=$('i'),B=$('b'),O=$('o'),KS=$('ks'),IS=$('is'),BS=$('bs'),OS=$('os'),TOTAL=$('total'),DIAG=$('diag'),NAME=$('name'),SET=$('set'),THEME=$('theme'),GENRE=$('genre'),NOTE=$('note'),BOX=$('attemptBox'),INFO=$('attemptInfo'),TEXT=$('attemptText');let pending=null;function readJSON(key,fallback){try{const v=JSON.parse(localStorage.getItem(key)||'null');return v??fallback}catch(e){return fallback}}function weakList(v){const a=[];if(v.k<=2)a.push('Kehendak');if(v.i<=2)a.push('Isi & Huraian');if(v.b<=2)a.push('Bahasa');if(v.o<=2)a.push('Organisasi / Format');return a}function calc(){const v={k:+K.value,i:+I.value,b:+B.value,o:+O.value};KS.textContent=v.k+'/5';IS.textContent=v.i+'/5';BS.textContent=v.b+'/5';OS.textContent=v.o+'/5';TOTAL.textContent=(v.k+v.i+v.b+v.o)+'/20';let d='';if(v.k<=2)d+=`<div class="weak"><b>Kehendak 弱：</b>先做 Kata Tugas 分类与题目改写。<br><a href="task-transform.html">题型转换 →</a></div>`;else d+=`<div class="good">Kehendak 基本稳定。</div>`;if(v.i<=2)d+=`<div class="weak"><b>Isi/Huraian 弱：</b>Fakta 练 Topik → Huraian → Contoh → Penegasan；需要时用 Kesan 帮助展开。叙事则练事件发展。<br><a href="training-ladder.html">训练阶梯 →</a></div>`;if(v.b<=2)d+=`<div class="weak"><b>Bahasa 弱：</b>先修 nahu、ejaan、tanda baca，再处理句式变化。<br><a href="checklist.html">语言检查 →</a></div>`;if(v.o<=2)d+=`<div class="weak"><b>Organisasi/Format 弱：</b>检查段落逻辑；若为 berformat，再检查文体外壳。<br><a href="format-lab.html">格式实验室 →</a></div>`;if(v.k>=3&&v.i>=3&&v.b>=3&&v.o>=3)d+=`<div class="good"><b>整体基本稳定。</b>继续完整模拟，提高内容成熟度、准确性和独立作答能力。</div>`;DIAG.innerHTML=d}function loadPending(){pending=readJSON('bmPendingAttempt',null);if(!pending)return;BOX.style.display='block';const sub=pending.subtheme?' · '+pending.subtheme:'';INFO.textContent=`${pending.set||''} · ${pending.question||''} · ${pending.jenis||''} · ${pending.tema||''}${sub} · ${pending.words||0} words`;TEXT.textContent=pending.essay||'';NAME.value=pending.student||'';SET.value=pending.set||'Independent';if([...THEME.options].some(o=>o.value===pending.tema))THEME.value=pending.tema;if([...GENRE.options].some(o=>o.value===pending.jenis))GENRE.value=pending.jenis}function save(){const v={k:+K.value,i:+I.value,b:+B.value,o:+O.value};const a=readJSON('bmScores',[]);if(!Array.isArray(a)){alert('现有评分记录格式异常，无法安全保存。');return}a.push({id:Date.now(),date:new Date().toLocaleString(),name:NAME.value.trim(),set:SET.value,theme:THEME.value,subtheme:pending?.subtheme||'',genre:GENRE.value,question:pending?.question||'',words:pending?.words||'',essay:pending?.essay||'',k:v.k,i:v.i,b:v.b,o:v.o,total:v.k+v.i+v.b+v.o,weak:weakList(v),note:NOTE.value.trim()});try{localStorage.setItem('bmScores',JSON.stringify(a));localStorage.removeItem('bmPendingAttempt')}catch(e){alert('浏览器无法保存评分记录。请检查隐私模式或储存空间。');return}alert('评分、作文与诊断已经保存。');location.href='student-progress.html'}[K,I,B,O].forEach(x=>x.addEventListener('input',calc));$('calcBtn').addEventListener('click',calc);$('saveBtn').addEventListener('click',save);loadPending();calc()})();</script></body></html>
